<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Agent - Barcode Scanner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Shopping Agent</h1>
      <p class="subtitle">Scan grocery barcodes with EAN/UPC validation to avoid wrong partial scans.</p>

      <div class="button-row">
        <button id="startScanBtn">Start Barcode Scan</button>
        <button id="stopScanBtn" class="secondary">Stop</button>
      </div>

      <div class="scanner-frame">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <div class="scan-box"></div>
        <div class="scan-line"></div>
      </div>

      <div class="result-box">
        <h2>Last valid barcode</h2>
        <p id="barcodeResult">No valid barcode scanned yet.</p>
      </div>

      <div class="manual-section">
        <label for="manualBarcode">Manual barcode entry</label>
        <div class="manual-row">
          <input id="manualBarcode" type="text" inputmode="numeric" placeholder="Example: 5449000233295" />
          <button id="addManualBtn">Add</button>
        </div>
      </div>

      <div class="status-box">
        <h2>Status</h2>
        <pre id="statusLog">Ready. Tap “Start Barcode Scan”.</pre>
      </div>
    </section>

    <section class="card">
      <h2>Fridge / Shopping List</h2>
      <ul id="itemList"></ul>
    </section>
  </main>

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="app.js"></script>
</body>
</html>

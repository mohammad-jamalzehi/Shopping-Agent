<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Agent - Barcode Camera</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Shopping Agent</h1>
      <p class="subtitle">Camera + barcode test for iPhone/Chrome and Safari.</p>

      <div class="button-row">
        <button id="startCameraBtn">Start Rear Camera</button>
        <button id="stopCameraBtn" class="secondary">Stop Camera</button>
      </div>

      <video id="cameraPreview" autoplay playsinline muted></video>

      <div class="fallback">
        <p><strong>iPhone fallback:</strong> open camera using file input.</p>
        <input id="cameraFileInput" type="file" accept="image/*" capture="environment" />
      </div>

      <label for="manualBarcode">Manual barcode entry</label>
      <div class="manual-row">
        <input id="manualBarcode" type="text" placeholder="Example: 8000500310427" />
        <button id="addManualBtn">Add</button>
      </div>

      <div class="status-box">
        <h2>Status</h2>
        <pre id="statusLog">Ready...</pre>
      </div>
    </section>

    <section class="card">
      <h2>Fridge / Shopping List</h2>
      <ul id="itemList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
